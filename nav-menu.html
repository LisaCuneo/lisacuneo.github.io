<script>
(function () {

  const body = document.body;
  const button = document.getElementById("floating-menu-button");
  const drawer = document.getElementById("floating-menu-drawer");
  const overlay = document.getElementById("floating-menu-overlay");

  if (!button || !drawer || !overlay) {
    return;
  }


  /* =====================================================
     SUBMENU STATE
     ===================================================== */

  function closeAllSubmenus() {

    drawer
      .querySelectorAll("[data-menu-submenu]")
      .forEach(function (submenu) {
        submenu.classList.remove("is-open");
      });

    drawer
      .querySelectorAll("[data-menu-group]")
      .forEach(function (group) {
        group.classList.remove("is-open");
      });

    drawer
      .querySelectorAll("[data-menu-toggle]")
      .forEach(function (toggle) {
        toggle.setAttribute("aria-expanded", "false");

        const groupName = toggle.getAttribute("data-menu-toggle");
        const label = groupName.charAt(0).toUpperCase() + groupName.slice(1);
        toggle.setAttribute("aria-label", "Show " + label + " sections");
      });
  }


  /* =====================================================
     DRAWER
     ===================================================== */

  function updateScrollState() {
    body.classList.toggle("nav-scrolled", window.scrollY > 8);
  }

  function openMenu() {
    /* Every time the drawer opens, start from the compact view. */
    closeAllSubmenus();

    body.classList.add("floating-menu-open");
    button.setAttribute("aria-expanded", "true");
    button.setAttribute("aria-label", "Close navigation menu");
    drawer.setAttribute("aria-hidden", "false");
  }

  function closeMenu() {
    body.classList.remove("floating-menu-open");
    button.setAttribute("aria-expanded", "false");
    button.setAttribute("aria-label", "Open navigation menu");
    drawer.setAttribute("aria-hidden", "true");
  }

  function toggleMenu() {
    if (body.classList.contains("floating-menu-open")) {
      closeMenu();
    } else {
      openMenu();
    }
  }


  /* =====================================================
     PAGE / SECTION HELPERS
     ===================================================== */

  function currentPageName() {
    const path = window.location.pathname;
    const file = path.split("/").pop();
    return file || "index.html";
  }

  function clearActiveStates() {
    drawer
      .querySelectorAll(".is-current-page, .is-active")
      .forEach(function (element) {
        element.classList.remove("is-current-page", "is-active");
      });
  }

  function updateActiveNavigation() {
    clearActiveStates();

    const page = currentPageName();

    drawer
      .querySelectorAll("[data-page-link]")
      .forEach(function (link) {
        if (link.getAttribute("data-page-link") === page) {
          link.classList.add("is-current-page");
        }
      });

    const sectionLinks = Array.from(
      drawer.querySelectorAll(
        '[data-section-page="' + page + '"][data-section-link]'
      )
    );

    if (!sectionLinks.length) {
      return;
    }

    const sections = sectionLinks
      .map(function (link) {
        const id = link.getAttribute("data-section-link");
        return {
          link: link,
          element: document.getElementById(id)
        };
      })
      .filter(function (item) {
        return item.element;
      });

    if (!sections.length) {
      return;
    }

    let active = null;
    const referenceY = 130;

    sections.forEach(function (item) {
      if (item.element.getBoundingClientRect().top <= referenceY) {
        active = item;
      }
    });

    if (active) {
      active.link.classList.add("is-active");
    }
  }


  /* =====================================================
     INDEPENDENT SUBMENUS
     ===================================================== */

  drawer
    .querySelectorAll("[data-menu-toggle]")
    .forEach(function (toggle) {

      toggle.addEventListener("click", function () {

        const groupName = toggle.getAttribute("data-menu-toggle");
        const group = drawer.querySelector(
          '[data-menu-group="' + groupName + '"]'
        );
        const submenu = drawer.querySelector(
          '[data-menu-submenu="' + groupName + '"]'
        );

        if (!group || !submenu) {
          return;
        }

        const isOpen = submenu.classList.contains("is-open");
        const nextOpen = !isOpen;

        submenu.classList.toggle("is-open", nextOpen);
        group.classList.toggle("is-open", nextOpen);

        toggle.setAttribute(
          "aria-expanded",
          nextOpen ? "true" : "false"
        );

        const label = groupName.charAt(0).toUpperCase() + groupName.slice(1);
        toggle.setAttribute(
          "aria-label",
          (nextOpen ? "Hide " : "Show ") + label + " sections"
        );
      });

    });


  /* =====================================================
     LINK NAVIGATION
     ===================================================== */

  /*
     Never intercept navigation. Links are plain HTML anchors and the
     browser follows their href normally. For same-page hash links we
     close the drawer on the next event-loop tick, after the browser has
     had a chance to process the click.
  */

  drawer
    .querySelectorAll('a[href]')
    .forEach(function (link) {

      link.addEventListener("click", function () {
        window.setTimeout(closeMenu, 0);
      });

    });


  /* =====================================================
     EVENTS
     ===================================================== */

  button.addEventListener("click", function () {
    toggleMenu();
  });

  overlay.addEventListener("click", function () {
    closeMenu();
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      closeMenu();
    }
  });

  window.addEventListener(
    "scroll",
    function () {
      updateScrollState();
      updateActiveNavigation();
    },
    { passive: true }
  );

  window.addEventListener("hashchange", updateActiveNavigation);

  closeAllSubmenus();
  updateScrollState();
  updateActiveNavigation();

})();
</script>
